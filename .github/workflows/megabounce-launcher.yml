name: Build MegaBounce Launcher

on:
  push:
    branches:
      - megabounce-launcher-20260806
    paths:
      - 'megabounce-launcher/**'
      - '.github/workflows/megabounce-launcher.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'megabounce-launcher/**'
      - '.github/workflows/megabounce-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p megabounce-launcher assembleDebug --stacktrace
          cp megabounce-launcher/app/build/outputs/apk/debug/app-debug.apk MegaBounceLauncher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaBounceLauncher
          path: MegaBounceLauncher.apk
          if-no-files-found: error
