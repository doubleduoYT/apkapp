name: Build One UI MegaBounce Home

on:
  push:
    branches:
      - oneui-megabounce-20260806
    paths:
      - 'READY'
      - 'chunks/**'
      - 'chaos/**'
      - '.github/workflows/build-oneui-megabounce.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'READY'
      - 'chunks/**'
      - 'chaos/**'
      - '.github/workflows/build-oneui-megabounce.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and extract project
        run: |
          cat chunks/part* | base64 -d > OneUIMegaBounce-source.zip
          unzip -t OneUIMegaBounce-source.zip
          mkdir work
          unzip -q OneUIMegaBounce-source.zip -d work

      - name: Apply chaos animation patch
        run: |
          cat chaos/p0* > chaos.patch
          cd work/OneUIMegaBounce-source
          patch -p1 < "$GITHUB_WORKSPACE/chaos.patch"
          grep -q "versionName '3.0-chaos'" app/build.gradle
          grep -q "private Animator chaosTo" app/src/main/java/com/hg/megabounce/oneui/MainActivity.java

      - name: Build debug APK
        run: |
          cd work/OneUIMegaBounce-source
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OneUI-MegaBounce-Chaos.apk"
          cd "$GITHUB_WORKSPACE"
          unzip -t OneUI-MegaBounce-Chaos.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneUI-MegaBounce-Chaos
          path: OneUI-MegaBounce-Chaos.apk
          if-no-files-found: error
