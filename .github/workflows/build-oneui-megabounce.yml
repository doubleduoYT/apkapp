name: Build One UI MegaBounce Home

on:
  push:
    branches:
      - oneui-megabounce-20260806
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir work
          unzip -q OneUIMegaBounce-source.zip -d work

      - name: Build debug APK
        run: |
          cd work/OneUIMegaBounce-source
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OneUI-MegaBounce-Home.apk"
          cd "$GITHUB_WORKSPACE"
          unzip -t OneUI-MegaBounce-Home.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneUI-MegaBounce-Home
          path: OneUI-MegaBounce-Home.apk
          if-no-files-found: error
